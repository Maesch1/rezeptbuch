# nginx.conf — Rezeptbuch (Reverse-Proxy zu Backend + statisches Frontend)
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log  /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;

    # Payload-Limit für Bild-Uploads (Base64 ~5MB → ~7MB encodiert)
    client_max_body_size 15m;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Sicherheits-Header
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header X-XSS-Protection       "1; mode=block" always;

        # API → Backend-Container
        location /api/ {
            proxy_pass         http://backend:3001;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://backend:3001/health;
        }

        # Statisches Frontend (SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(css|js|woff2?|ttf|ico|png|jpg|jpeg|gif|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
    }
}
