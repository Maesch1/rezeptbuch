<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezeptbuch</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{
      --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
      --color-surface-offset:#f3f0ec;--color-border:#d4d1ca;--color-divider:#dcd9d5;
      --color-text:#28251d;--color-text-muted:#7a7974;--color-text-faint:#bab9b4;
      --color-primary:#01696f;--color-primary-hover:#0c4e54;
      --color-primary-highlight:#cedcd8;
      --color-error:#a12c7b;--color-success:#437a22;--color-warning:#964219;
      --shadow-sm:0 1px 2px oklch(0.2 0.01 80/.06);
      --shadow-md:0 4px 12px oklch(0.2 0.01 80/.08);
      --shadow-lg:0 12px 32px oklch(0.2 0.01 80/.12);
      --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;
      --font-body:'Satoshi','Inter',sans-serif;
      --font-display:'Cabinet Grotesk','Satoshi',sans-serif;
      --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
      --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
      --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
      --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
      --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
      --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
      --space-12:3rem;--space-16:4rem;
      --transition:180ms cubic-bezier(.16,1,.3,1);
    }
    [data-theme="dark"]{
      --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
      --color-surface-offset:#1d1c1a;--color-border:#393836;--color-divider:#262523;
      --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
      --color-primary:#4f98a3;--color-primary-hover:#227f8b;
      --color-primary-highlight:#313b3b;
      --color-error:#d163a7;--color-success:#6daa45;--color-warning:#bb653b;
      --shadow-sm:0 1px 2px oklch(0 0 0/.2);
      --shadow-md:0 4px 12px oklch(0 0 0/.3);
      --shadow-lg:0 12px 32px oklch(0 0 0/.4);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
    body{font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);min-height:100dvh;transition:background var(--transition),color var(--transition)}
    img{display:block;max-width:100%;height:auto}
    button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
    input,textarea,select{font:inherit;color:inherit}
    h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;text-wrap:balance}
    p,li{text-wrap:pretty;max-width:72ch}
    :focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}

    .app{display:grid;grid-template-rows:auto 1fr;min-height:100dvh}
    header{
      position:sticky;top:0;z-index:100;
      background:var(--color-surface);border-bottom:1px solid var(--color-divider);
      box-shadow:var(--shadow-sm);
      padding:var(--space-3) var(--space-6);
      display:flex;align-items:center;gap:var(--space-4);
    }
    .logo{display:flex;align-items:center;gap:var(--space-2);text-decoration:none;color:var(--color-text)}
    .logo-text{font-family:var(--font-display);font-size:var(--text-lg);font-weight:800;letter-spacing:-.02em}
    .logo-text span{color:var(--color-primary)}
    .header-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
    .rezept-count{font-size:var(--text-xs);color:var(--color-text-faint);white-space:nowrap}
    .btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;transition:background var(--transition),color var(--transition),box-shadow var(--transition);text-decoration:none}
    .btn-primary{background:var(--color-primary);color:#fff}
    .btn-primary:hover{background:var(--color-primary-hover)}
    .btn-ghost{color:var(--color-text-muted);padding:var(--space-2)}
    .btn-ghost:hover{color:var(--color-text);background:var(--color-surface-offset)}
    .btn-sm{padding:var(--space-1) var(--space-3);font-size:var(--text-xs)}
    .btn-danger{background:oklch(from var(--color-error) l c h /.12);color:var(--color-error)}
    .btn-danger:hover{background:oklch(from var(--color-error) l c h /.2)}
    main{padding:var(--space-8) var(--space-6);max-width:1200px;margin-inline:auto;width:100%}

    /* Toolbar */
    .toolbar{display:flex;gap:var(--space-3);margin-bottom:var(--space-6);flex-wrap:wrap;align-items:center}
    .search-wrap{position:relative;flex:1;min-width:200px}
    .search-wrap svg{position:absolute;left:var(--space-3);top:50%;transform:translateY(-50%);color:var(--color-text-muted);pointer-events:none}
    .search-input{width:100%;padding:var(--space-2) var(--space-3) var(--space-2) calc(var(--space-3)*3);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);font-size:var(--text-sm);transition:border-color var(--transition),box-shadow var(--transition)}
    .search-input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-highlight);outline:none}
    .filter-select{padding:var(--space-2) var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);font-size:var(--text-sm);cursor:pointer}
    .filter-select:focus{border-color:var(--color-primary);outline:none}

    /* Grid & Card */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:var(--space-5)}
    .card{background:var(--color-surface);border:1px solid oklch(from var(--color-text) l c h/.08);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow var(--transition),transform var(--transition)}
    .card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
    /* Bild auf Karte */
    .card-img{width:100%;height:160px;object-fit:cover;display:block}
    .card-img-placeholder{width:100%;height:160px;background:var(--color-surface-offset);display:flex;align-items:center;justify-content:center;color:var(--color-text-faint)}
    .card-body{padding:var(--space-4) var(--space-5)}
    .card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-2);margin-bottom:var(--space-3)}
    .card-title{font-size:var(--text-lg);font-weight:700;color:var(--color-text)}
    .badge{display:inline-flex;align-items:center;padding:2px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:500;white-space:nowrap;background:var(--color-primary-highlight);color:var(--color-primary)}
    .card-meta{display:flex;gap:var(--space-4);color:var(--color-text-muted);font-size:var(--text-xs);margin-bottom:var(--space-3)}
    .meta-item{display:flex;align-items:center;gap:var(--space-1)}
    .card-preview{font-size:var(--text-sm);color:var(--color-text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-actions{display:flex;gap:var(--space-2);margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--color-divider)}

    /* Empty */
    .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--space-16) var(--space-8);color:var(--color-text-muted)}
    .empty svg{color:var(--color-text-faint);margin-bottom:var(--space-4)}
    .empty h3{font-family:var(--font-display);font-size:var(--text-lg);color:var(--color-text);margin-bottom:var(--space-2)}
    .empty p{max-width:36ch;margin-bottom:var(--space-6)}

    /* Modal */
    .overlay{position:fixed;inset:0;background:oklch(.1 0 0/.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:var(--space-4);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity var(--transition)}
    .overlay.open{opacity:1;pointer-events:all}
    .modal{background:var(--color-surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:100%;max-width:680px;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(12px);transition:transform var(--transition)}
    .overlay.open .modal{transform:translateY(0)}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--color-divider);flex-shrink:0}
    .modal-title{font-family:var(--font-display);font-size:var(--text-lg);font-weight:700}
    .modal-body{padding:var(--space-6);overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-5)}
    .modal-footer{padding:var(--space-4) var(--space-6);border-top:1px solid var(--color-divider);display:flex;justify-content:flex-end;gap:var(--space-3);flex-shrink:0}

    /* Form */
    .form-group{display:flex;flex-direction:column;gap:var(--space-1)}
    label{font-size:var(--text-sm);font-weight:500;color:var(--color-text-muted)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
    .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-3)}
    input[type=text],input[type=number],input[type=file],select,textarea{
      width:100%;padding:var(--space-2) var(--space-3);border:1px solid var(--color-border);
      border-radius:var(--radius-md);background:var(--color-surface-2);font-size:var(--text-sm);
      transition:border-color var(--transition),box-shadow var(--transition)
    }
    input:focus,select:focus,textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-highlight);outline:none}
    textarea{resize:vertical;min-height:80px}
    input[type=file]{padding:var(--space-1) var(--space-2);cursor:pointer;background:var(--color-surface-offset)}

    /* Bild-Vorschau */
    .img-preview-wrap{position:relative;border-radius:var(--radius-lg);overflow:hidden}
    .img-preview{width:100%;height:200px;object-fit:cover;display:block}
    .img-preview-placeholder{
      width:100%;height:130px;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:var(--space-2);color:var(--color-text-faint);
      font-size:var(--text-sm);border:2px dashed var(--color-border);
      border-radius:var(--radius-lg);background:var(--color-surface-offset)
    }
    .img-remove{position:absolute;top:var(--space-2);right:var(--space-2);background:oklch(.1 0 0/.65);color:#fff;border-radius:var(--radius-full);width:30px;height:30px;display:flex;align-items:center;justify-content:center;transition:background var(--transition)}
    .img-remove:hover{background:oklch(.1 0 0/.85)}

    /* Zutaten-Tabelle */
    .zutat-header{display:grid;grid-template-columns:80px 130px 1fr 32px;gap:var(--space-2);font-size:var(--text-xs);color:var(--color-text-faint);padding:0 0 var(--space-1);letter-spacing:.03em;text-transform:uppercase}
    .zutaten-list{display:flex;flex-direction:column;gap:var(--space-2)}
    .zutat-row{display:grid;grid-template-columns:80px 130px 1fr 32px;gap:var(--space-2);align-items:center}
    .zutat-row input[type=text],.zutat-row input[type=number]{padding:var(--space-2) var(--space-2)}
    .zutat-row select{padding:var(--space-2) var(--space-2)}
    .add-row-btn{align-self:flex-start;color:var(--color-primary);font-size:var(--text-sm);font-weight:500;padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);transition:background var(--transition);margin-top:var(--space-1)}
    .add-row-btn:hover{background:var(--color-primary-highlight)}
    .del-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-md);color:var(--color-error);transition:background var(--transition)}
    .del-btn:hover{background:oklch(from var(--color-error) l c h/.1)}

    /* Schritte */
    .schritte-list{display:flex;flex-direction:column;gap:var(--space-2)}
    .schritt-row{display:flex;gap:var(--space-2);align-items:flex-start}
    .schritt-num{flex:0 0 28px;height:28px;border-radius:var(--radius-full);background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);font-weight:700;margin-top:6px}
    .schritt-row textarea{flex:1}

    /* Detail-Overlay */
    .detail-overlay{position:fixed;inset:0;background:oklch(.1 0 0/.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:var(--space-6) var(--space-4);backdrop-filter:blur(4px);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity var(--transition)}
    .detail-overlay.open{opacity:1;pointer-events:all}
    .detail-card{background:var(--color-surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:100%;max-width:720px;overflow:hidden;position:relative;transform:translateY(12px);transition:transform var(--transition)}
    .detail-overlay.open .detail-card{transform:translateY(0)}
    /* Detail-Bild */
    .detail-hero{width:100%;height:280px;object-fit:cover;display:block}
    .detail-hero-placeholder{width:100%;height:80px;background:var(--color-surface-offset);display:flex;align-items:center;justify-content:center;color:var(--color-text-faint)}
    .detail-content{padding:var(--space-6) var(--space-8)}
    .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-3)}
    .detail-title{font-family:var(--font-display);font-size:var(--text-xl);font-weight:800}
    .detail-meta{display:flex;gap:var(--space-5);color:var(--color-text-muted);font-size:var(--text-sm);margin-bottom:var(--space-6);flex-wrap:wrap}
    .detail-section{margin-bottom:var(--space-6)}
    .detail-section-title{font-family:var(--font-display);font-size:var(--text-base);font-weight:700;margin-bottom:var(--space-3);padding-bottom:var(--space-2);border-bottom:1px solid var(--color-divider)}
    .zutat-item{display:flex;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid oklch(from var(--color-text) l c h/.05);font-size:var(--text-sm)}
    .zutat-menge{color:var(--color-text-muted);min-width:140px;flex-shrink:0}
    .schritt-item{display:flex;gap:var(--space-3);margin-bottom:var(--space-4);font-size:var(--text-sm)}
    .schritt-item p{max-width:none}
    .detail-actions{display:flex;gap:var(--space-3);padding-top:var(--space-5);border-top:1px solid var(--color-divider)}

    /* Toast */
    .toast-wrap{position:fixed;bottom:var(--space-6);right:var(--space-6);z-index:300;display:flex;flex-direction:column;gap:var(--space-2)}
    .toast{padding:var(--space-3) var(--space-5);border-radius:var(--radius-lg);font-size:var(--text-sm);font-weight:500;color:#fff;box-shadow:var(--shadow-lg);animation:slideIn .2s ease;max-width:320px}
    .toast.success{background:var(--color-success)}
    .toast.error{background:var(--color-error)}
    @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

    /* Save-Indikator */
    .save-badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);color:var(--color-success);opacity:0;transition:opacity .3s}
    .save-badge.show{opacity:1}

    @media(max-width:600px){
      header{padding:var(--space-3) var(--space-4)}
      main{padding:var(--space-5) var(--space-4)}
      .form-row,.form-row-3{grid-template-columns:1fr}
      .zutat-header{grid-template-columns:70px 1fr 32px;}
      .zutat-header .col-einheit{display:none}
      .zutat-row{grid-template-columns:70px 1fr 32px}
      .zutat-row .einheit-sel{display:none}
      .detail-content{padding:var(--space-5)}
      .detail-hero{height:200px}
      .rezept-count{display:none}
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <a class="logo" href="#" onclick="return false">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="Rezeptbuch Logo">
        <rect width="28" height="28" rx="7" fill="var(--color-primary)"/>
        <path d="M8 8h12M8 14h8M8 20h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="3" fill="#fff"/>
      </svg>
      <span class="logo-text">Rezept<span>buch</span></span>
    </a>
    <span class="rezept-count" id="rezeptCount"></span>
    <span class="save-badge" id="saveBadge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Gespeichert
    </span>
    <div class="header-right">
      <button class="btn btn-primary" onclick="openForm()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Neues Rezept
      </button>
      <button class="btn btn-ghost" data-theme-toggle aria-label="Hell/Dunkel umschalten">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" id="searchInput" type="search" placeholder="Rezepte suchen…" oninput="filterRezepte()">
      </div>
      <select class="filter-select" id="katFilter" onchange="filterRezepte()">
        <option value="">Alle Kategorien</option>
        <option>Frühstück</option><option>Mittagessen</option><option>Abendessen</option>
        <option>Dessert</option><option>Snacks</option><option>Getränke</option><option>Sonstiges</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- ═══ FORMULAR MODAL ═══ -->
<div class="overlay" id="formOverlay" onclick="closeFormOnBg(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Neues Rezept</span>
      <button class="btn btn-ghost" onclick="closeForm()" aria-label="Schliessen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">

      <!-- Bild -->
      <div class="form-group">
        <label>Foto (optional)</label>
        <div id="imgPreviewWrap" class="img-preview-placeholder">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span>Bild auswählen oder hier ablegen</span>
        </div>
        <input type="file" id="fBild" accept="image/*" onchange="previewBild(this)">
      </div>

      <!-- Titel -->
      <div class="form-group">
        <label for="fTitel">Titel *</label>
        <input type="text" id="fTitel" placeholder="z.B. Spaghetti Carbonara">
      </div>

      <!-- Kategorie / Portionen / Zeit -->
      <div class="form-row">
        <div class="form-group">
          <label for="fKat">Kategorie</label>
          <select id="fKat">
            <option>Frühstück</option><option>Mittagessen</option><option selected>Abendessen</option>
            <option>Dessert</option><option>Snacks</option><option>Getränke</option><option>Sonstiges</option>
          </select>
        </div>
        <div class="form-row" style="gap:var(--space-3)">
          <div class="form-group">
            <label for="fPortionen">Portionen</label>
            <input type="number" id="fPortionen" value="2" min="1" max="99">
          </div>
          <div class="form-group">
            <label for="fZeit">Zeit (Min.)</label>
            <input type="number" id="fZeit" value="30" min="1" max="999">
          </div>
        </div>
      </div>

      <!-- Zutaten -->
      <div class="form-group">
        <label>Zutaten</label>
        <div class="zutat-header">
          <span>Menge</span><span class="col-einheit">Einheit</span><span>Zutat</span><span></span>
        </div>
        <div class="zutaten-list" id="zutatenList"></div>
        <button class="add-row-btn" type="button" onclick="addZutat()">+ Zutat hinzufügen</button>
      </div>

      <!-- Schritte -->
      <div class="form-group">
        <label>Zubereitung</label>
        <div class="schritte-list" id="schritteList"></div>
        <button class="add-row-btn" type="button" onclick="addSchritt()">+ Schritt hinzufügen</button>
      </div>

      <!-- Notizen -->
      <div class="form-group">
        <label for="fNotizen">Notizen &amp; Tipps</label>
        <textarea id="fNotizen" placeholder="Tipps, Variationen, Allergene…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeForm()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveRezept()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Speichern
      </button>
    </div>
  </div>
</div>

<!-- ═══ DETAIL OVERLAY ═══ -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetailOnBg(event)">
  <div class="detail-card">
    <div id="dHeroWrap"></div>
    <div class="detail-content">
      <div class="detail-head">
        <div>
          <div id="dBadge" class="badge" style="margin-bottom:var(--space-2)"></div>
          <h1 class="detail-title" id="dTitel"></h1>
        </div>
        <button class="btn btn-ghost" onclick="closeDetail()" aria-label="Schliessen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="detail-meta" id="dMeta"></div>
      <div class="detail-section">
        <div class="detail-section-title">Zutaten</div>
        <div id="dZutaten"></div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">Zubereitung</div>
        <div id="dSchritte"></div>
      </div>
      <div class="detail-section" id="dNotizenSection" style="display:none">
        <div class="detail-section-title">Notizen</div>
        <p id="dNotizen" style="font-size:var(--text-sm);color:var(--color-text-muted)"></p>
      </div>
      <div class="detail-actions">
        <button class="btn btn-primary" id="dEditBtn">Bearbeiten</button>
        <button class="btn btn-danger" id="dDelBtn">Löschen</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
// ════════════════════════════════════
//  DATEN — localStorage (kein Backend)
// ════════════════════════════════════
const STORE_KEY = 'rezeptbuch_v2';
let alle = [];
let bildBase64 = null;

function ladeDaten() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    alle = raw ? JSON.parse(raw) : [];
  } catch { alle = []; }
}
function speichereDaten() {
  localStorage.setItem(STORE_KEY, JSON.stringify(alle));
  const b = document.getElementById('saveBadge');
  b.classList.add('show');
  clearTimeout(b._t);
  b._t = setTimeout(() => b.classList.remove('show'), 2000);
}
function nextId() {
  return alle.length ? Math.max(...alle.map(r => r.id)) + 1 : 1;
}

// ════════════════════════════════════
//  EINHEITEN
// ════════════════════════════════════
const EINHEITEN = [
  { gruppe: 'Volumen',    werte: ['ml','cl','dl','l','TL','EL','Tasse','Schuss'] },
  { gruppe: 'Gewicht',    werte: ['g','kg','mg'] },
  { gruppe: 'Stück',      werte: ['Stk.','Stück','Bund','Scheibe','Zehe','Blatt','Pck.','Dose','Glas','Becher','Flasche'] },
  { gruppe: 'Gewürze',    werte: ['Prise','Msp.','TL','EL','nach Geschmack','etwas','1 Spritzer','wenig','reichlich'] },
  { gruppe: 'Sonstiges',  werte: ['–', 'nach Bedarf'] },
];

function buildEinheitOptions(selected = '') {
  let html = '<option value="">(Einheit)</option>';
  EINHEITEN.forEach(g => {
    html += `<optgroup label="${g.gruppe}">`;
    g.werte.forEach(w => {
      html += `<option${w === selected ? ' selected' : ''}>${w}</option>`;
    });
    html += '</optgroup>';
  });
  return html;
}

// ════════════════════════════════════
//  THEME
// ════════════════════════════════════
(function () {
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  r.setAttribute('data-theme', d);
  function updateIcon() {
    if (!t) return;
    t.innerHTML = d === 'dark'
      ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  }
  updateIcon();
  t && t.addEventListener('click', () => {
    d = d === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', d);
    updateIcon();
  });
})();

// ════════════════════════════════════
//  TOAST
// ════════════════════════════════════
function toast(msg, type = 'success') {
  const w = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  w.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ════════════════════════════════════
//  RENDER
// ════════════════════════════════════
function filterRezepte() {
  const s = document.getElementById('searchInput').value.toLowerCase();
  const k = document.getElementById('katFilter').value;
  render(alle.filter(r =>
    (!s || r.titel.toLowerCase().includes(s) || (r.notizen || '').toLowerCase().includes(s)) &&
    (!k || r.kategorie === k)
  ));
}

function render(rezepte) {
  // Zähler
  document.getElementById('rezeptCount').textContent =
    alle.length ? `${alle.length} Rezept${alle.length !== 1 ? 'e' : ''}` : '';

  const g = document.getElementById('grid');
  if (!rezepte.length) {
    g.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
      </svg>
      <h3>${alle.length ? 'Keine Treffer' : 'Noch keine Rezepte'}</h3>
      <p>${alle.length ? 'Passe die Suche an oder wähle eine andere Kategorie.' : 'Erstelle jetzt dein erstes Rezept.'}</p>
      ${!alle.length ? '<button class="btn btn-primary" onclick="openForm()">Erstes Rezept erstellen</button>' : ''}
    </div>`;
    return;
  }

  g.innerHTML = rezepte.map(r => {
    // Bild-HTML für Karte
    const imgHtml = r.bild
      ? `<img class="card-img" src="${r.bild}" alt="${esc(r.titel)}" loading="lazy" width="300" height="160">`
      : `<div class="card-img-placeholder">
           <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
             <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
           </svg>
         </div>`;
    return `
    <article class="card" onclick="openDetail(${r.id})" tabindex="0" role="button" aria-label="${esc(r.titel)} öffnen">
      ${imgHtml}
      <div class="card-body">
        <div class="card-header">
          <h2 class="card-title">${esc(r.titel)}</h2>
          <span class="badge">${esc(r.kategorie)}</span>
        </div>
        <div class="card-meta">
          <span class="meta-item">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            ${r.kochzeit} Min.
          </span>
          <span class="meta-item">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            ${r.portionen} Port.
          </span>
          <span class="meta-item" style="margin-left:auto">${r.zutaten.length} Zutaten</span>
        </div>
        ${r.schritte.length ? `<p class="card-preview">${esc(r.schritte[0])}</p>` : ''}
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="btn btn-ghost btn-sm" onclick="openEdit(${r.id})">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
            Bearbeiten
          </button>
          <button class="btn btn-ghost btn-sm" style="color:var(--color-error)" onclick="deleteRezept(${r.id})">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            Löschen
          </button>
        </div>
      </div>
    </article>`;
  }).join('');
}

// ════════════════════════════════════
//  DETAIL
// ════════════════════════════════════
function openDetail(id) {
  const r = alle.find(x => x.id === id);
  if (!r) return;
  document.getElementById('dBadge').textContent = r.kategorie;
  document.getElementById('dTitel').textContent = r.titel;

  // Bild in Detail
  document.getElementById('dHeroWrap').innerHTML = r.bild
    ? `<img class="detail-hero" src="${r.bild}" alt="${esc(r.titel)}" loading="lazy">`
    : `<div class="detail-hero-placeholder">
         <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
           <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
         </svg>
       </div>`;

  document.getElementById('dMeta').innerHTML = `
    <span>⏱ ${r.kochzeit} Minuten</span>
    <span>👥 ${r.portionen} Portionen</span>
    <span>🥘 ${r.zutaten.length} Zutaten</span>
    <span>📋 ${r.schritte.length} Schritte</span>`;

  document.getElementById('dZutaten').innerHTML = r.zutaten.map(z => {
    const mengeEinheit = [z.menge, z.einheit].filter(Boolean).join(' ');
    return `<div class="zutat-item">
      <span class="zutat-menge">${esc(mengeEinheit)}</span>
      <span>${esc(z.name || z)}</span>
    </div>`;
  }).join('');

  document.getElementById('dSchritte').innerHTML = r.schritte.map((s, i) =>
    `<div class="schritt-item">
      <div class="schritt-num">${i + 1}</div>
      <p>${esc(s)}</p>
    </div>`
  ).join('');

  const n = r.notizen && r.notizen.trim();
  document.getElementById('dNotizenSection').style.display = n ? 'block' : 'none';
  document.getElementById('dNotizen').textContent = n || '';
  document.getElementById('dEditBtn').onclick = () => { closeDetail(); openEdit(id); };
  document.getElementById('dDelBtn').onclick = () => deleteRezept(id);
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }
function closeDetailOnBg(e) { if (e.target === document.getElementById('detailOverlay')) closeDetail(); }

// ════════════════════════════════════
//  BILD VORSCHAU
// ════════════════════════════════════
function previewBild(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) { toast('Bild max. 3 MB', 'error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = e => { bildBase64 = e.target.result; showImgPreview(bildBase64); };
  reader.readAsDataURL(file);
}
function showImgPreview(src) {
  const w = document.getElementById('imgPreviewWrap');
  w.className = 'img-preview-wrap';
  w.innerHTML = `<img class="img-preview" src="${src}" alt="Vorschau">
    <button type="button" class="img-remove" onclick="clearBild()" aria-label="Bild entfernen">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>`;
}
function clearBild() {
  bildBase64 = null;
  document.getElementById('fBild').value = '';
  const w = document.getElementById('imgPreviewWrap');
  w.className = 'img-preview-placeholder';
  w.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Bild auswählen oder hier ablegen</span>`;
}

// ════════════════════════════════════
//  FORMULAR
// ════════════════════════════════════
function openForm(data = null) {
  bildBase64 = data ? (data.bild || null) : null;
  document.getElementById('editId').value = data ? data.id : '';
  document.getElementById('modalTitle').textContent = data ? 'Rezept bearbeiten' : 'Neues Rezept';
  document.getElementById('fTitel').value = data ? data.titel : '';
  document.getElementById('fKat').value = data ? data.kategorie : 'Abendessen';
  document.getElementById('fPortionen').value = data ? data.portionen : 2;
  document.getElementById('fZeit').value = data ? data.kochzeit : 30;
  document.getElementById('fNotizen').value = data ? (data.notizen || '') : '';
  document.getElementById('fBild').value = '';
  if (bildBase64) showImgPreview(bildBase64); else clearBild();

  const zl = document.getElementById('zutatenList'); zl.innerHTML = '';
  const initZutaten = data ? data.zutaten : [{ menge: '', einheit: '', name: '' }];
  initZutaten.forEach(z => addZutat(z));

  const sl = document.getElementById('schritteList'); sl.innerHTML = '';
  const initSchritte = data ? data.schritte : [''];
  initSchritte.forEach(s => addSchritt(s));

  document.getElementById('formOverlay').classList.add('open');
  setTimeout(() => document.getElementById('fTitel').focus(), 60);
}
function openEdit(id) { const r = alle.find(x => x.id === id); if (r) openForm(r); }
function closeForm() { document.getElementById('formOverlay').classList.remove('open'); bildBase64 = null; }
function closeFormOnBg(e) { if (e.target === document.getElementById('formOverlay')) closeForm(); }

function addZutat(z = {}) {
  const row = document.createElement('div'); row.className = 'zutat-row';
  row.innerHTML = `
    <input type="text" placeholder="200" value="${esc(z.menge || '')}" aria-label="Menge">
    <select class="einheit-sel" aria-label="Einheit">${buildEinheitOptions(z.einheit || '')}</select>
    <input type="text" placeholder="z.B. Mehl" value="${esc(z.name || '')}" aria-label="Zutat">
    <button type="button" class="del-btn" onclick="this.closest('.zutat-row').remove()" aria-label="Entfernen">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>`;
  document.getElementById('zutatenList').appendChild(row);
}

function addSchritt(text = '') {
  const list = document.getElementById('schritteList');
  const num = list.children.length + 1;
  const row = document.createElement('div'); row.className = 'schritt-row';
  row.innerHTML = `
    <div class="schritt-num">${num}</div>
    <textarea placeholder="Schritt beschreiben…" rows="2">${esc(text)}</textarea>
    <button type="button" class="del-btn" onclick="removeSchritt(this)" aria-label="Entfernen" style="margin-top:5px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>`;
  list.appendChild(row);
}
function removeSchritt(btn) {
  btn.closest('.schritt-row').remove();
  document.querySelectorAll('#schritteList .schritt-num').forEach((el, i) => el.textContent = i + 1);
}

// ════════════════════════════════════
//  SPEICHERN / LÖSCHEN
// ════════════════════════════════════
function saveRezept() {
  const titel = document.getElementById('fTitel').value.trim();
  if (!titel) { toast('Bitte einen Titel angeben.', 'error'); document.getElementById('fTitel').focus(); return; }

  const zutaten = [...document.querySelectorAll('#zutatenList .zutat-row')].map(row => {
    const inputs = row.querySelectorAll('input[type=text]');
    const sel = row.querySelector('select');
    return { menge: inputs[0].value.trim(), einheit: sel ? sel.value : '', name: inputs[1].value.trim() };
  }).filter(z => z.name);

  const schritte = [...document.querySelectorAll('#schritteList textarea')]
    .map(t => t.value.trim()).filter(Boolean);

  const id = document.getElementById('editId').value;
  const rezept = {
    id: id ? Number(id) : nextId(),
    titel,
    kategorie: document.getElementById('fKat').value,
    portionen: +document.getElementById('fPortionen').value || 2,
    kochzeit: +document.getElementById('fZeit').value || 30,
    zutaten,
    schritte,
    notizen: document.getElementById('fNotizen').value.trim(),
    bild: bildBase64 || null,
    erstellt: id ? (alle.find(r => r.id === Number(id))?.erstellt || new Date().toISOString()) : new Date().toISOString(),
  };

  if (id) {
    const idx = alle.findIndex(r => r.id === Number(id));
    if (idx !== -1) alle[idx] = rezept;
  } else {
    alle.unshift(rezept);
  }

  speichereDaten();
  toast(id ? 'Rezept aktualisiert! ✏️' : 'Rezept gespeichert! 🎉');
  closeForm();
  filterRezepte();
}

function deleteRezept(id) {
  if (!confirm('Rezept wirklich löschen?')) return;
  alle = alle.filter(r => r.id !== id);
  speichereDaten();
  toast('Rezept gelöscht.');
  closeDetail();
  filterRezepte();
}

// ════════════════════════════════════
//  HILFSFUNKTIONEN
// ════════════════════════════════════
function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s || '');
  return d.innerHTML;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeForm(); closeDetail(); }
});

// ════════════════════════════════════
//  START
// ════════════════════════════════════
ladeDaten();
filterRezepte();
</script>
</body>
</html>
