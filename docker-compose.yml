services:
  backend:
    build:
      context: ./backend
    container_name: rezeptbuch_backend
    restart: unless-stopped
    volumes:
      - rezeptbuch_data:/app/data
    environment:
      - DATA_DIR=/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: rezeptbuch_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  rezeptbuch_data:
    driver: local
