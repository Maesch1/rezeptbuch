# ═══════════════════════════════════════════════════════════
#  Rezeptbuch — Docker Compose
#
#  Starten:  docker compose up -d --build
#  Stoppen:  docker compose down
#  Logs:     docker compose logs -f
#  Rebuild:  docker compose down && docker compose up -d --build
# ═══════════════════════════════════════════════════════════

services:

  # ─── Backend (Node.js + Express + sql.js) ─────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rezeptbuch-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      DB_PATH: "/data/rezeptbuch.db"
    volumes:
      - rezept_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "3001"

  # ─── Frontend (nginx statisch + Reverse-Proxy zu Backend) ─
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rezeptbuch-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  rezept_data:
