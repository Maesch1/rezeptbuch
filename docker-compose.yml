# ═══════════════════════════════════════════════════════════
#  Rezeptbuch — Docker Compose
#  Starten:  docker compose up -d --build
#  Stoppen:  docker compose down
#  Logs:     docker compose logs -f
#  Rebuild:  docker compose up -d --build
# ═══════════════════════════════════════════════════════════

services:

  # ─── Backend (Node.js + Express + SQLite) ─────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rezeptbuch-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      DB_PATH: "/data/rezeptbuch.db"
    volumes:
      - rezept_data:/data          # SQLite-Datenbank persistent
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "3001"                     # Nur intern erreichbar

  # ─── Frontend (nginx → Reverse-Proxy zu Backend) ──────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rezeptbuch-frontend
    restart: unless-stopped
    ports:
      - "8080:80"                  # Öffentlich: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rezept_data:                     # Persistente SQLite-Datenbank
