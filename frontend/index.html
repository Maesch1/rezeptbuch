<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezeptbuch</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{
      --bg:#f7f6f2;--surf:#f9f8f5;--surf2:#fbfbf9;--surf3:#f3f0ec;
      --brd:#d4d1ca;--div:#dcd9d5;
      --tx:#28251d;--txm:#7a7974;--txf:#bab9b4;
      --pr:#01696f;--prh:#0c4e54;--prhl:#cedcd8;
      --err:#a12c7b;--ok:#437a22;--warn:#964219;
      --shsm:0 1px 2px oklch(0.2 0.01 80/.06);
      --shmd:0 4px 12px oklch(0.2 0.01 80/.08);
      --shlg:0 12px 32px oklch(0.2 0.01 80/.12);
      --r1:.375rem;--r2:.5rem;--r3:.75rem;--r4:1rem;
      --fb:'Satoshi','Inter',sans-serif;
      --fd:'Cabinet Grotesk','Satoshi',sans-serif;
      --txs:clamp(.75rem,.7rem + .25vw,.875rem);
      --txsm:clamp(.875rem,.8rem + .35vw,1rem);
      --txb:clamp(1rem,.95rem + .25vw,1.125rem);
      --txl:clamp(1.125rem,1rem + .75vw,1.5rem);
      --txxl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --tr:180ms cubic-bezier(.16,1,.3,1);
    }
    [data-theme="dark"]{
      --bg:#171614;--surf:#1c1b19;--surf2:#201f1d;--surf3:#1d1c1a;
      --brd:#393836;--div:#262523;
      --tx:#cdccca;--txm:#797876;--txf:#5a5957;
      --pr:#4f98a3;--prh:#227f8b;--prhl:#313b3b;
      --err:#d163a7;--ok:#6daa45;--warn:#bb653b;
      --shsm:0 1px 2px oklch(0 0 0/.25);
      --shmd:0 4px 12px oklch(0 0 0/.35);
      --shlg:0 12px 32px oklch(0 0 0/.45);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
    body{font-family:var(--fb);font-size:var(--txb);color:var(--tx);background:var(--bg);min-height:100dvh}
    img{display:block;max-width:100%;height:auto}
    button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
    input,textarea,select{font:inherit;color:inherit}
    h1,h2,h3,h4{font-family:var(--fd);line-height:1.15}
    :focus-visible{outline:2px solid var(--pr);outline-offset:3px;border-radius:var(--r1)}
    a,button,input,textarea,select{transition:color var(--tr),background var(--tr),border-color var(--tr),box-shadow var(--tr)}

    /* ── Layout ── */
    .app{display:grid;grid-template-rows:auto 1fr;min-height:100dvh}
    header{position:sticky;top:0;z-index:100;background:var(--surf);border-bottom:1px solid var(--div);box-shadow:var(--shsm);padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem}
    .logo{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--tx)}
    .logo-text{font-family:var(--fd);font-size:var(--txl);font-weight:800;letter-spacing:-.02em}
    .logo-text span{color:var(--pr)}
    .hdr-right{margin-left:auto;display:flex;align-items:center;gap:.75rem}
    .rcount{font-size:var(--txs);color:var(--txf);white-space:nowrap}
    .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:var(--r2);font-size:var(--txsm);font-weight:500}
    .btn-pr{background:var(--pr);color:#fff} .btn-pr:hover{background:var(--prh)}
    .btn-gh{color:var(--txm);padding:.5rem} .btn-gh:hover{color:var(--tx);background:var(--surf3)}
    .btn-sm{padding:.25rem .75rem;font-size:var(--txs)}
    .btn-danger{background:oklch(from var(--err) l c h/.12);color:var(--err)} .btn-danger:hover{background:oklch(from var(--err) l c h/.22)}
    .btn-pdf{background:oklch(from var(--warn) l c h/.12);color:var(--warn)} .btn-pdf:hover{background:oklch(from var(--warn) l c h/.22)}
    main{padding:2rem 1.5rem;max-width:1200px;margin-inline:auto;width:100%}

    /* ── Banner ── */
    .banner{display:flex;align-items:center;gap:.75rem;padding:.75rem 1.25rem;border-radius:var(--r3);font-size:var(--txsm);margin-bottom:1.25rem}
    .banner.ok{background:oklch(from var(--ok) l c h/.1);color:var(--ok)}
    .banner.err{background:oklch(from var(--warn) l c h/.1);color:var(--warn)}
    .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}

    /* ── Toolbar ── */
    .toolbar{display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
    .swrap{position:relative;flex:1;min-width:200px}
    .swrap svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--txm);pointer-events:none}
    .sinput{width:100%;padding:.5rem .75rem .5rem 2.25rem;border:1px solid var(--brd);border-radius:var(--r2);background:var(--surf);font-size:var(--txsm)}
    .sinput:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--prhl);outline:none}
    .fsel{padding:.5rem 1rem;border:1px solid var(--brd);border-radius:var(--r2);background:var(--surf);font-size:var(--txsm);cursor:pointer}
    .fsel:focus{border-color:var(--pr);outline:none}

    /* ── Grid & Card ── */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:1.25rem}
    .card{background:var(--surf);border:1px solid oklch(from var(--tx) l c h/.08);border-radius:var(--r4);overflow:hidden;box-shadow:var(--shsm);cursor:pointer;transition:box-shadow var(--tr),transform var(--tr)}
    .card:hover{box-shadow:var(--shmd);transform:translateY(-2px)}
    .cimg{width:100%;height:160px;object-fit:cover}
    .cph{width:100%;height:160px;background:var(--surf3);display:flex;align-items:center;justify-content:center;color:var(--txf)}
    .cbody{padding:1rem 1.25rem}
    .chdr{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;margin-bottom:.75rem}
    .ctitle{font-size:var(--txl);font-weight:700}
    .badge{display:inline-flex;align-items:center;padding:2px .5rem;border-radius:9999px;font-size:var(--txs);font-weight:500;background:var(--prhl);color:var(--pr)}
    .cmeta{display:flex;gap:1rem;color:var(--txm);font-size:var(--txs);margin-bottom:.75rem}
    .mi{display:flex;align-items:center;gap:.25rem}
    .cprev{font-size:var(--txsm);color:var(--txm);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .cact{display:flex;gap:.5rem;margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--div)}

    /* ── Empty / Skeleton ── */
    .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4rem 2rem;color:var(--txm)}
    .empty svg{color:var(--txf);margin-bottom:1rem}
    .empty h3{font-family:var(--fd);font-size:var(--txl);color:var(--tx);margin-bottom:.5rem}
    .empty p{max-width:36ch;margin-bottom:1.5rem}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .sk{background:linear-gradient(90deg,var(--surf3) 25%,var(--surf2) 50%,var(--surf3) 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:var(--r1)}
    .skc{background:var(--surf);border:1px solid oklch(from var(--tx) l c h/.08);border-radius:var(--r4);overflow:hidden}
    .skimg{height:160px;width:100%}
    .skbody{padding:1rem 1.25rem}
    .skl{height:.875rem;margin-bottom:.5rem}
    .skl.w70{width:70%}.skl.w40{width:40%}.skl.w55{width:55%}

    /* ── Modal ── */
    .ov{position:fixed;inset:0;background:oklch(.1 0 0/.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity var(--tr)}
    .ov.open{opacity:1;pointer-events:all}
    .modal{background:var(--surf);border-radius:var(--r4);box-shadow:var(--shlg);width:100%;max-width:700px;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(10px);transition:transform var(--tr)}
    .ov.open .modal{transform:translateY(0)}
    .mhdr{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--div);flex-shrink:0}
    .mtitle{font-family:var(--fd);font-size:var(--txl);font-weight:700}
    .mbody{padding:1.5rem;overflow-y:auto;display:flex;flex-direction:column;gap:1.25rem}
    .mfoot{padding:1rem 1.5rem;border-top:1px solid var(--div);display:flex;justify-content:flex-end;gap:.75rem;flex-shrink:0}

    /* ── Form ── */
    .fg{display:flex;flex-direction:column;gap:.25rem}
    label{font-size:var(--txsm);font-weight:500;color:var(--txm)}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    input[type=text],input[type=number],select,textarea{width:100%;padding:.5rem .75rem;border:1px solid var(--brd);border-radius:var(--r2);background:var(--surf2);font-size:var(--txsm)}
    input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--prhl);outline:none}
    textarea{resize:vertical;min-height:80px}

    /* ── Bild Upload ── */
    .dropz{position:relative;border:2px dashed var(--brd);border-radius:var(--r3);overflow:hidden;cursor:pointer;transition:border-color var(--tr),background var(--tr)}
    .dropz:hover,.dropz.drag{border-color:var(--pr);background:var(--prhl)}
    .dropz input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
    .dropph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:var(--txf);font-size:var(--txsm);padding:2rem 1rem;text-align:center;pointer-events:none}
    .dropph strong{color:var(--txm);font-weight:500}
    .dropph span{font-size:var(--txs)}
    .prevwrap{position:relative;border-radius:var(--r3);overflow:hidden}
    .previmg{width:100%;height:200px;object-fit:cover}
    .prevdel{position:absolute;top:.5rem;right:.5rem;background:oklch(.1 0 0/.7);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
    .prevdel:hover{background:oklch(.1 0 0/.9)}
    .prevchg{position:absolute;bottom:.5rem;left:50%;transform:translateX(-50%);background:oklch(.1 0 0/.7);color:#fff;border-radius:var(--r2);padding:.25rem .75rem;font-size:var(--txs);font-weight:500;white-space:nowrap}
    .prevchg input{position:absolute;inset:0;opacity:0;cursor:pointer}

    /* ── Zutaten ── */
    .zhdr{display:grid;grid-template-columns:80px 150px 1fr 32px;gap:.5rem;font-size:var(--txs);color:var(--txf);padding:0 0 .25rem;letter-spacing:.03em;text-transform:uppercase}
    .zlist{display:flex;flex-direction:column;gap:.5rem}
    .zrow{display:grid;grid-template-columns:80px 150px 1fr 32px;gap:.5rem;align-items:center}
    .zrow input,.zrow select{padding:.4rem .5rem}
    .addrow{align-self:flex-start;color:var(--pr);font-size:var(--txsm);font-weight:500;padding:.25rem .5rem;border-radius:var(--r1)}
    .addrow:hover{background:var(--prhl)}
    .delbtn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--r2);color:var(--err)}
    .delbtn:hover{background:oklch(from var(--err) l c h/.12)}
    .slist{display:flex;flex-direction:column;gap:.5rem}
    .srow{display:flex;gap:.5rem;align-items:flex-start}
    .snum{flex:0 0 28px;height:28px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--txs);font-weight:700;margin-top:5px}
    .srow textarea{flex:1}

    /* ── Detail ── */
    .dov{position:fixed;inset:0;background:oklch(.1 0 0/.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;backdrop-filter:blur(4px);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity var(--tr)}
    .dov.open{opacity:1;pointer-events:all}
    .dcard{background:var(--surf);border-radius:var(--r4);box-shadow:var(--shlg);width:100%;max-width:720px;overflow:hidden;transform:translateY(10px);transition:transform var(--tr)}
    .dov.open .dcard{transform:translateY(0)}
    .dhero{width:100%;height:280px;object-fit:cover}
    .dhero-ph{width:100%;height:80px;background:var(--surf3);display:flex;align-items:center;justify-content:center;color:var(--txf)}
    .dcontent{padding:1.5rem 2rem}
    .dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.75rem}
    .dtitle{font-family:var(--fd);font-size:var(--txxl);font-weight:800}
    .dmeta{display:flex;gap:1.25rem;color:var(--txm);font-size:var(--txsm);margin-bottom:1.5rem;flex-wrap:wrap}
    .dsec{margin-bottom:1.5rem}
    .dsectitle{font-family:var(--fd);font-size:var(--txb);font-weight:700;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--div)}
    .zi{display:flex;gap:.75rem;padding:.5rem 0;border-bottom:1px solid oklch(from var(--tx) l c h/.05);font-size:var(--txsm)}
    .zmenge{color:var(--txm);min-width:150px;flex-shrink:0}
    .sti{display:flex;gap:.75rem;margin-bottom:1rem;font-size:var(--txsm)}
    .sti p{max-width:none}
    .dact{display:flex;gap:.75rem;padding-top:1.25rem;border-top:1px solid var(--div);flex-wrap:wrap}

    /* ── Toast ── */
    .twrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:300;display:flex;flex-direction:column;gap:.5rem}
    .toast{padding:.75rem 1.25rem;border-radius:var(--r3);font-size:var(--txsm);font-weight:500;color:#fff;box-shadow:var(--shlg);animation:slideIn .2s ease;max-width:320px}
    .toast.ok{background:var(--ok)}.toast.err{background:var(--err)}
    @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

    /* ── Print / PDF ── */
    @media print{
      *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
      body{background:#fff !important;color:#111 !important;font-family:Georgia,serif}
      header,.toolbar,.cact,.dact,.twrap{display:none !important}
      .dov{position:static !important;opacity:1 !important;pointer-events:all !important;padding:0 !important;background:none !important;backdrop-filter:none !important;display:block !important}
      .dcard{box-shadow:none !important;border-radius:0 !important;max-width:100% !important;transform:none !important}
      .dhero{height:200px}
      .dcontent{padding:1.5rem 2rem}
      .dtitle{font-size:1.8rem}
      .dsectitle{color:#01696f;border-bottom:1px solid #ccc}
      .zi{border-bottom:1px solid #eee}
      .snum{background:#01696f !important;color:#fff !important;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
      .ov,.dov:not(#detailOv),.grid,main>*:not(#detailOv){display:none !important}
      .pdfhdr{display:block !important;padding:.5rem 2rem;font-size:.7rem;color:#999;border-bottom:1px solid #ddd;margin-bottom:.5rem}
    }
    .pdfhdr{display:none}

    @media(max-width:600px){
      header{padding:.75rem 1rem} main{padding:1.25rem 1rem}
      .frow{grid-template-columns:1fr}
      .zhdr{grid-template-columns:70px 1fr 32px} .zhdr .ceinheit{display:none}
      .zrow{grid-template-columns:70px 1fr 32px} .zrow .einsel{display:none}
      .dcontent{padding:1.25rem}
      .dtitle{font-size:1.4rem}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <a class="logo" href="#" onclick="return false">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="Logo">
        <rect width="28" height="28" rx="7" fill="var(--pr)"/>
        <path d="M8 8h12M8 14h8M8 20h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="3" fill="#fff"/>
      </svg>
      <span class="logo-text">Rezept<span>buch</span></span>
    </a>
    <span class="rcount" id="rcount"></span>
    <div class="hdr-right">
      <button class="btn btn-pr" onclick="openForm()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Neues Rezept
      </button>
      <button class="btn btn-gh" id="themeBtn" data-theme-toggle aria-label="Theme wechseln">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="apiBanner"></div>
    <div class="toolbar">
      <div class="swrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="sinput" id="search" type="search" placeholder="Rezepte suchen…" oninput="filterAll()">
      </div>
      <select class="fsel" id="katF" onchange="filterAll()">
        <option value="">Alle Kategorien</option>
        <option>Frühstück</option><option>Mittagessen</option><option>Abendessen</option>
        <option>Dessert</option><option>Snacks</option><option>Getränke</option><option>Sonstiges</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- FORM MODAL -->
<div class="ov" id="formOv" onclick="closeFBg(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="mhdr">
      <span class="mtitle" id="mtitle">Neues Rezept</span>
      <button class="btn btn-gh" onclick="closeF()" aria-label="Schliessen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="mbody">
      <input type="hidden" id="editId">

      <div class="fg">
        <label>Foto (optional)</label>
        <div id="dropz" class="dropz">
          <input type="file" id="fBild" accept="image/*" onchange="prevBild(this)">
          <div class="dropph" id="dropph">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <strong>Klicken oder Bild hierher ziehen</strong>
            <span>JPG, PNG, WebP · max. 8 MB</span>
          </div>
        </div>
        <div id="prevwrap" style="display:none"></div>
      </div>

      <div class="fg">
        <label for="fT">Titel *</label>
        <input type="text" id="fT" placeholder="z.B. Spaghetti Carbonara">
      </div>
      <div class="frow">
        <div class="fg">
          <label for="fK">Kategorie</label>
          <select id="fK"><option>Frühstück</option><option>Mittagessen</option><option selected>Abendessen</option><option>Dessert</option><option>Snacks</option><option>Getränke</option><option>Sonstiges</option></select>
        </div>
        <div class="frow" style="gap:.75rem">
          <div class="fg"><label for="fP">Portionen</label><input type="number" id="fP" value="2" min="1" max="99"></div>
          <div class="fg"><label for="fZ">Zeit (Min.)</label><input type="number" id="fZ" value="30" min="1" max="999"></div>
        </div>
      </div>

      <div class="fg">
        <label>Zutaten</label>
        <div class="zhdr"><span>Menge</span><span class="ceinheit">Einheit</span><span>Zutat</span><span></span></div>
        <div class="zlist" id="zlist"></div>
        <button class="addrow" type="button" onclick="addZ()">+ Zutat hinzufügen</button>
      </div>

      <div class="fg">
        <label>Zubereitung</label>
        <div class="slist" id="slist"></div>
        <button class="addrow" type="button" onclick="addS()">+ Schritt hinzufügen</button>
      </div>

      <div class="fg">
        <label for="fN">Notizen &amp; Tipps</label>
        <textarea id="fN" placeholder="Tipps, Variationen, Allergene…"></textarea>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-gh" onclick="closeF()">Abbrechen</button>
      <button class="btn btn-pr" id="saveBtn" onclick="saveR()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Speichern
      </button>
    </div>
  </div>
</div>

<!-- DETAIL -->
<div class="dov" id="detailOv" onclick="closeDOvBg(event)">
  <div class="dcard">
    <div class="pdfhdr">Rezeptbuch · <span id="pdfDate"></span></div>
    <div id="dhero"></div>
    <div class="dcontent">
      <div class="dhead">
        <div>
          <div id="dbadge" class="badge" style="margin-bottom:.5rem"></div>
          <h1 class="dtitle" id="dtitle"></h1>
        </div>
        <button class="btn btn-gh" onclick="closeD()" aria-label="Schliessen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="dmeta" id="dmeta"></div>
      <div class="dsec"><div class="dsectitle">Zutaten</div><div id="dzutaten"></div></div>
      <div class="dsec"><div class="dsectitle">Zubereitung</div><div id="dschritte"></div></div>
      <div class="dsec" id="dnotsec" style="display:none">
        <div class="dsectitle">Notizen</div>
        <p id="dnotizen" style="font-size:var(--txsm);color:var(--txm)"></p>
      </div>
      <div class="dact">
        <button class="btn btn-pr" id="dEditBtn">Bearbeiten</button>
        <button class="btn btn-pdf" onclick="exportPdf()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Als PDF
        </button>
        <button class="btn btn-danger" id="dDelBtn">Löschen</button>
      </div>
    </div>
  </div>
</div>

<div class="twrap" id="twrap"></div>

<script>
// ─── Config ───────────────────────────────────────────────
const API = '';  // Relative URLs → nginx-Proxy → backend:3001
let alle = [];
let bildB64 = null;
let apiOk = false;

// ─── API ──────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const r = await fetch(API + path, { headers:{'Content-Type':'application/json'}, ...opts });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
async function checkApi() {
  try { await fetch('/health'); apiOk = true; } catch { apiOk = false; }
  const el = document.getElementById('apiBanner');
  el.innerHTML = apiOk
    ? `<div class="banner ok"><div class="dot"></div>Backend verbunden — Rezepte werden in der Datenbank gespeichert.</div>`
    : `<div class="banner err"><div class="dot"></div>Backend nicht erreichbar — Offline-Modus (Browser-Speicher).</div>`;
}

// ─── Lokaler Fallback ─────────────────────────────────────
function loadLocal() { try { alle = JSON.parse(localStorage.getItem('rzb_v4')||'[]'); } catch { alle=[]; } }
function saveLocal() { localStorage.setItem('rzb_v4', JSON.stringify(alle)); }
function nextId() { return alle.length ? Math.max(...alle.map(r=>r.id))+1 : 1; }
async function loadData() {
  if (apiOk) { try { alle = await apiFetch('/api/rezepte'); return; } catch {} }
  loadLocal();
}

// ─── Einheiten ────────────────────────────────────────────
const EINH = [
  ['Volumen', ['ml','cl','dl','l','TL','EL','Tasse','Tassen','Schuss','Spritzer']],
  ['Gewicht', ['mg','g','kg','Unze (oz)']],
  ['Stück',   ['Stk.','Stück','Bund','Scheibe','Scheiben','Zehe','Zehen','Blatt','Blätter','Pck.','Packung','Dose','Glas','Becher','Flasche','Zweig']],
  ['Gewürze', ['Prise','Prisen','Msp.','Tropfen','etwas','wenig','nach Geschmack']],
  ['Backen',  ['Würfel','Tüte','Beutel','Riegel','Block']],
  ['–',       ['–','nach Bedarf','beliebig']],
];
function einhOpts(sel='') {
  return '<option value="">(Einheit)</option>' +
    EINH.map(([g,ws])=>`<optgroup label="${g}">${ws.map(w=>`<option${w===sel?' selected':''}>${w}</option>`).join('')}</optgroup>`).join('');
}

// ─── Theme ────────────────────────────────────────────────
(function(){
  const btn = document.getElementById('themeBtn');
  const html = document.documentElement;
  const pref = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  let theme = pref;
  html.setAttribute('data-theme', theme);
  function setIcon() {
    btn.innerHTML = theme === 'dark'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  }
  setIcon();
  btn.addEventListener('click', () => { theme = theme==='dark'?'light':'dark'; html.setAttribute('data-theme',theme); setIcon(); });
})();

// ─── Toast ────────────────────────────────────────────────
function toast(msg, type='ok') {
  const w = document.getElementById('twrap'), el = document.createElement('div');
  el.className = `toast ${type}`; el.textContent = msg; w.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ─── Skeleton ─────────────────────────────────────────────
function showSkel() {
  document.getElementById('grid').innerHTML = Array.from({length:6}).map(()=>`
    <div class="skc">
      <div class="sk skimg"></div>
      <div class="skbody">
        <div class="sk skl w70" style="margin-bottom:.75rem"></div>
        <div class="sk skl w40"></div>
        <div class="sk skl w55"></div>
      </div>
    </div>`).join('');
}

// ─── Render ───────────────────────────────────────────────
function filterAll() {
  const s = document.getElementById('search').value.toLowerCase();
  const k = document.getElementById('katF').value;
  render(alle.filter(r=>
    (!s || r.titel.toLowerCase().includes(s) || (r.notizen||'').toLowerCase().includes(s)) &&
    (!k || r.kategorie === k)
  ));
}
function render(list) {
  document.getElementById('rcount').textContent = alle.length ? `${alle.length} Rezept${alle.length!==1?'e':''}` : '';
  const g = document.getElementById('grid');
  if (!list.length) {
    g.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      <h3>${alle.length ? 'Keine Treffer' : 'Noch keine Rezepte'}</h3>
      <p>${alle.length ? 'Andere Suche versuchen.' : 'Lege jetzt dein erstes Rezept an.'}</p>
      ${!alle.length ? '<button class="btn btn-pr" onclick="openForm()">Erstes Rezept</button>' : ''}
    </div>`;
    return;
  }
  g.innerHTML = list.map(r => {
    const img = r.bild
      ? `<img class="cimg" src="${r.bild}" alt="${e(r.titel)}" loading="lazy" width="300" height="160">`
      : `<div class="cph"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
    return `<article class="card" onclick="openD(${r.id})" tabindex="0">
      ${img}
      <div class="cbody">
        <div class="chdr"><h2 class="ctitle">${e(r.titel)}</h2><span class="badge">${e(r.kategorie)}</span></div>
        <div class="cmeta">
          <span class="mi"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${r.kochzeit} Min.</span>
          <span class="mi"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>${r.portionen} Port.</span>
          <span class="mi" style="margin-left:auto">${r.zutaten.length} Zutaten</span>
        </div>
        ${r.schritte.length ? `<p class="cprev">${e(r.schritte[0])}</p>` : ''}
        <div class="cact" onclick="event.stopPropagation()">
          <button class="btn btn-gh btn-sm" onclick="openEdit(${r.id})"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>Bearbeiten</button>
          <button class="btn btn-sm" style="color:var(--err)" onclick="delR(${r.id})"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>Löschen</button>
        </div>
      </div>
    </article>`;
  }).join('');
}

// ─── Detail ───────────────────────────────────────────────
async function openD(id) {
  let r = alle.find(x => x.id === id);
  if (apiOk) { try { r = await apiFetch(`/api/rezepte/${id}`); } catch {} }
  if (!r) return;
  document.getElementById('dbadge').textContent = r.kategorie;
  document.getElementById('dtitle').textContent = r.titel;
  document.getElementById('dhero').innerHTML = r.bild
    ? `<img class="dhero" src="${r.bild}" alt="${e(r.titel)}">`
    : `<div class="dhero-ph"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
  document.getElementById('dmeta').innerHTML =
    `<span>⏱ ${r.kochzeit} Min.</span><span>👥 ${r.portionen} Port.</span><span>🥘 ${r.zutaten.length} Zutaten</span><span>📋 ${r.schritte.length} Schritte</span>`;
  document.getElementById('dzutaten').innerHTML = r.zutaten.map(z => {
    const m = [z.menge, z.einheit].filter(Boolean).join(' ');
    return `<div class="zi"><span class="zmenge">${e(m)}</span><span>${e(z.name||z)}</span></div>`;
  }).join('');
  document.getElementById('dschritte').innerHTML = r.schritte.map((s,i) =>
    `<div class="sti"><div class="snum">${i+1}</div><p>${e(s)}</p></div>`).join('');
  const n = (r.notizen||'').trim();
  document.getElementById('dnotsec').style.display = n ? 'block' : 'none';
  document.getElementById('dnotizen').textContent = n;
  document.getElementById('dEditBtn').onclick = () => { closeD(); openEdit(id); };
  document.getElementById('dDelBtn').onclick = () => delR(id);
  document.getElementById('detailOv').classList.add('open');
}
function closeD() { document.getElementById('detailOv').classList.remove('open'); }
function closeDOvBg(ev) { if (ev.target === document.getElementById('detailOv')) closeD(); }

// ─── PDF ──────────────────────────────────────────────────
function exportPdf() {
  document.getElementById('pdfDate').textContent =
    new Date().toLocaleDateString('de-CH',{day:'2-digit',month:'long',year:'numeric'});
  window.print();
}

// ─── Bild ─────────────────────────────────────────────────
function initDrop() {
  const z = document.getElementById('dropz');
  z.addEventListener('dragover', ev => { ev.preventDefault(); z.classList.add('drag'); });
  z.addEventListener('dragleave', () => z.classList.remove('drag'));
  z.addEventListener('drop', ev => {
    ev.preventDefault(); z.classList.remove('drag');
    const f = ev.dataTransfer.files[0];
    if (f?.type.startsWith('image/')) handleImg(f);
    else toast('Nur Bilddateien!', 'err');
  });
}
function prevBild(inp) { if (inp.files[0]) handleImg(inp.files[0]); }
function handleImg(f) {
  if (f.size > 8*1024*1024) { toast('Bild max. 8 MB', 'err'); return; }
  const rd = new FileReader();
  rd.onload = ev => { bildB64 = ev.target.result; showPrev(bildB64); };
  rd.readAsDataURL(f);
}
function showPrev(src) {
  document.getElementById('dropz').style.display = 'none';
  const w = document.getElementById('prevwrap');
  w.style.display = 'block'; w.className = 'prevwrap';
  w.innerHTML = `
    <img class="previmg" src="${src}" alt="Vorschau">
    <button type="button" class="prevdel" onclick="clearImg()" aria-label="Entfernen">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <label class="prevchg">📷 Ändern<input type="file" accept="image/*" onchange="prevBild(this)"></label>`;
}
function clearImg() {
  bildB64 = null;
  document.getElementById('fBild').value = '';
  document.getElementById('dropz').style.display = '';
  const w = document.getElementById('prevwrap');
  w.style.display = 'none'; w.innerHTML = '';
}

// ─── Formular ─────────────────────────────────────────────
function openForm(data=null) {
  bildB64 = data ? (data.bild||null) : null;
  document.getElementById('editId').value = data ? data.id : '';
  document.getElementById('mtitle').textContent = data ? 'Rezept bearbeiten' : 'Neues Rezept';
  document.getElementById('fT').value = data ? data.titel : '';
  document.getElementById('fK').value = data ? data.kategorie : 'Abendessen';
  document.getElementById('fP').value = data ? data.portionen : 2;
  document.getElementById('fZ').value = data ? data.kochzeit : 30;
  document.getElementById('fN').value = data ? (data.notizen||'') : '';
  document.getElementById('fBild').value = '';
  if (bildB64) showPrev(bildB64); else clearImg();
  const zl = document.getElementById('zlist'); zl.innerHTML = '';
  (data ? data.zutaten : [{menge:'',einheit:'',name:''}]).forEach(z => addZ(z));
  const sl = document.getElementById('slist'); sl.innerHTML = '';
  (data ? data.schritte : ['']).forEach(s => addS(s));
  document.getElementById('formOv').classList.add('open');
  initDrop();
  setTimeout(() => document.getElementById('fT').focus(), 60);
}
async function openEdit(id) {
  let r = alle.find(x => x.id === id);
  if (apiOk) { try { r = await apiFetch(`/api/rezepte/${id}`); } catch {} }
  if (r) openForm(r);
}
function closeF() { document.getElementById('formOv').classList.remove('open'); bildB64 = null; }
function closeFBg(ev) { if (ev.target === document.getElementById('formOv')) closeF(); }

function addZ(z={}) {
  const row = document.createElement('div'); row.className = 'zrow';
  row.innerHTML = `<input type="text" placeholder="200" value="${e(z.menge||'')}" aria-label="Menge"><select class="einsel" aria-label="Einheit">${einhOpts(z.einheit||'')}</select><input type="text" placeholder="z.B. Mehl" value="${e(z.name||'')}" aria-label="Zutat"><button type="button" class="delbtn" onclick="this.closest('.zrow').remove()" aria-label="Entfernen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;
  document.getElementById('zlist').appendChild(row);
}
function addS(text='') {
  const l = document.getElementById('slist'), n = l.children.length+1;
  const row = document.createElement('div'); row.className = 'srow';
  row.innerHTML = `<div class="snum">${n}</div><textarea placeholder="Schritt beschreiben…" rows="2">${e(text)}</textarea><button type="button" class="delbtn" onclick="rmS(this)" aria-label="Entfernen" style="margin-top:5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;
  l.appendChild(row);
}
function rmS(btn) {
  btn.closest('.srow').remove();
  document.querySelectorAll('#slist .snum').forEach((el,i) => el.textContent = i+1);
}

// ─── Speichern ────────────────────────────────────────────
async function saveR() {
  const titel = document.getElementById('fT').value.trim();
  if (!titel) { toast('Bitte Titel angeben.','err'); document.getElementById('fT').focus(); return; }
  const zutaten = [...document.querySelectorAll('#zlist .zrow')].map(row => {
    const inp = row.querySelectorAll('input[type=text]');
    const sel = row.querySelector('select');
    return { menge:inp[0].value.trim(), einheit:sel?sel.value:'', name:inp[1].value.trim() };
  }).filter(z => z.name);
  const schritte = [...document.querySelectorAll('#slist textarea')].map(t=>t.value.trim()).filter(Boolean);
  const id = document.getElementById('editId').value;
  const payload = {
    titel,
    kategorie: document.getElementById('fK').value,
    portionen: +document.getElementById('fP').value || 2,
    kochzeit:  +document.getElementById('fZ').value || 30,
    notizen:   document.getElementById('fN').value.trim(),
    bild: bildB64 || null,
    zutaten, schritte
  };
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Speichere…';
  try {
    if (apiOk) {
      const saved = id
        ? await apiFetch(`/api/rezepte/${id}`, {method:'PUT', body:JSON.stringify(payload)})
        : await apiFetch('/api/rezepte', {method:'POST', body:JSON.stringify(payload)});
      if (id) { const i = alle.findIndex(r=>r.id===Number(id)); i!==-1 ? alle[i]=saved : alle.unshift(saved); }
      else alle.unshift(saved);
    } else {
      const r = {...payload, id:id?Number(id):nextId(), erstellt:new Date().toISOString()};
      if (id) { const i=alle.findIndex(r=>r.id===Number(id)); i!==-1?alle[i]=r:alle.unshift(r); }
      else alle.unshift(r);
      saveLocal();
    }
    toast(id ? 'Aktualisiert ✏️' : 'Gespeichert 🎉');
    closeF();
    filterAll();
  } catch(err) {
    toast('Fehler: '+err.message,'err');
  } finally {
    btn.disabled=false;
    btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Speichern';
  }
}
async function delR(id) {
  if (!confirm('Rezept wirklich löschen?')) return;
  if (apiOk) { try { await apiFetch(`/api/rezepte/${id}`,{method:'DELETE'}); } catch(err) { toast('Fehler: '+err.message,'err'); return; } }
  alle = alle.filter(r => r.id !== id);
  if (!apiOk) saveLocal();
  toast('Gelöscht.'); closeD(); filterAll();
}

// ─── Utils ────────────────────────────────────────────────
function e(s) { const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }
document.addEventListener('keydown', ev => { if(ev.key==='Escape'){closeF();closeD();} });

// ─── Start ────────────────────────────────────────────────
(async () => {
  showSkel();
  await checkApi();
  await loadData();
  filterAll();
})();
</script>
</body>
</html>
